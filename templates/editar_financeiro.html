{% extends "layout/base.html" %}

{% block title %}
Editar Financeiro
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-success text-white">

        <h4 class="mb-0">

            Financeiro - {{ financeiro.projeto.nome }}

        </h4>

    </div>

    <div class="card-body">

        <form method="POST"
              action="/financeiro/atualizar/{{ financeiro.id }}">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Projeto</label>

                    <input
                        class="form-control"
                        value="{{ financeiro.projeto.nome }}"
                        disabled>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Cliente</label>

                    <input
                        class="form-control"
                        value="{{ financeiro.projeto.cliente.nome }}"
                        disabled>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Valor do Contrato</label>

                    <input
                        type="number"
                        step="0.01"
                        name="valor_contrato"
                        class="form-control"
                        value="{{ financeiro.valor_contrato }}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Valor Recebido</label>

                    <input
                        type="number"
                        step="0.01"
                        name="valor_recebido"
                        class="form-control"
                        value="{{ financeiro.valor_recebido }}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Nota Fiscal</label>

                    <input
                        type="text"
                        name="nota_fiscal"
                        class="form-control"
                        value="{{ financeiro.nota_fiscal or '' }}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Status Financeiro</label>

                    <select
                        name="status"
                        class="form-select">

                        {% for s in ["A Faturar","Faturado","Recebimento Parcial","Pago","Cancelado"] %}

                        <option
                            value="{{ s }}"
                            {% if financeiro.status == s %}selected{% endif %}>

                            {{ s }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Data de Faturamento</label>

                    <input
                        type="date"
                        name="data_faturamento"
                        class="form-control"
                        value="{{ financeiro.data_faturamento if financeiro.data_faturamento else '' }}">

                </div>

                <div class="col-md-6 mb-3">

                    <label>Data de Recebimento</label>

                    <input
                        type="date"
                        name="data_recebimento"
                        class="form-control"
                        value="{{ financeiro.data_recebimento if financeiro.data_recebimento else '' }}">

                </div>

                <div class="col-12 mb-3">

                    <label>Observações</label>

                    <textarea
                        name="observacoes"
                        rows="5"
                        class="form-control">{{ financeiro.observacoes or "" }}</textarea>

                </div>

            </div>

            <button
                class="btn btn-success">

                Salvar Alterações

            </button>

            <a
                href="/financeiro"
                class="btn btn-secondary">

                Cancelar

            </a>

        </form>

    </div>

</div>

{% endblock %}
