{% extends "layout/base.html" %}

{% block title %}
Painel
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>Painel</h2>

        <small class="text-muted">

            Bem-vindo(a) ao Sistema Grupo G&D

        </small>

    </div>

</div>

<div class="row">

    <div class="col-lg-3 mb-4">
        <div class="card dashboard-card">
            <div class="card-body">

                <h6>
                    <i class="bi bi-buildings"></i>
                    Clientes
                </h6>

                <h2>{{ total_clientes }}</h2>

            </div>
        </div>
    </div>

    <div class="col-lg-3 mb-4">
        <div class="card dashboard-card">

            <div class="card-body">

                <h6>
                    <i class="bi bi-folder2-open"></i>
                    Projetos
                </h6>

                <h2>{{ total_projetos }}</h2>

            </div>

        </div>
    </div>

    <div class="col-lg-3 mb-4">

        <div class="card dashboard-card">

            <div class="card-body">

                <h6>
                    <i class="bi bi-calendar3"></i>
                    Planejamentos
                </h6>

                <h2>{{ total_planejamentos }}</h2>

            </div>

        </div>

    </div>

    <div class="col-lg-3 mb-4">

        <div class="card dashboard-card">

            <div class="card-body">

                <h6>
                    <i class="bi bi-check-circle-fill"></i>
                    Sistema
                </h6>

                <h2>Online</h2>

            </div>

        </div>

    </div>

</div>

{% endblock %}
