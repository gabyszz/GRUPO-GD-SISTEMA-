{% extends "layout/base.html" %}
{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            <i class="bi bi-calendar-plus"></i>
            Novo Compromisso
        </h2>

        <a href="{{ url_for('calendario.listar_calendario') }}"
           class="btn btn-secondary">
            Voltar
        </a>

    </div>


    <div class="card shadow">

        <div class="card-body">


            <form method="POST">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


                <!-- TÍTULO -->

                <div class="mb-3">

                    <label class="form-label">
                        Título do compromisso
                    </label>

                    <input 
                        type="text"
                        name="titulo"
                        class="form-control"
                        placeholder="Ex: Levantamento topográfico - Cliente X"
                        required>

                </div>



                <!-- DESCRIÇÃO -->

                <div class="mb-3">

                    <label class="form-label">
                        Descrição
                    </label>

                    <textarea
                        name="descricao"
                        class="form-control"
                        rows="4"
                        placeholder="Detalhes do compromisso..."></textarea>

                </div>



                <div class="row">


                    <!-- DATA INÍCIO -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Data início
                        </label>

                        <input
                            type="date"
                            name="data_inicio"
                            class="form-control"
                            required>

                    </div>



                    <!-- DATA FIM -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Data fim
                        </label>

                        <input
                            type="date"
                            name="data_fim"
                            class="form-control">

                    </div>



                    <!-- STATUS -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Status
                        </label>


                        <select
                            name="status"
                            class="form-select">


                            <option value="Agendado">
                                Agendado
                            </option>


                            <option value="Confirmado">
                                Confirmado
                            </option>


                            <option value="Realizado">
                                Realizado
                            </option>


                            <option value="Cancelado">
                                Cancelado
                            </option>


                        </select>


                    </div>


                </div>




                <div class="row">


                    <!-- HORA INÍCIO -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Horário início
                        </label>


                        <input
                            type="time"
                            name="hora_inicio"
                            class="form-control">


                    </div>




                    <!-- HORA FIM -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Horário fim
                        </label>


                        <input
                            type="time"
                            name="hora_fim"
                            class="form-control">


                    </div>




                    <!-- COR -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Cor do evento
                        </label>


                        <select
                            name="cor"
                            class="form-select">


                            <option value="blue">
                                Azul
                            </option>


                            <option value="green">
                                Verde
                            </option>


                            <option value="orange">
                                Laranja
                            </option>


                            <option value="red">
                                Vermelho
                            </option>


                            <option value="purple">
                                Roxo
                            </option>


                        </select>


                    </div>


                </div>




                <div class="text-end mt-4">


                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-check-circle"></i>
                        Salvar Compromisso

                    </button>


                </div>



            </form>


        </div>

    </div>


</div>


{% endblock %}
