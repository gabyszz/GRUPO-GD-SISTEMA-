{% extends "layout/base.html" %}

{% block title %}
Novo Usuário
{% endblock %}

{% block content %}

<h2>Novo Usuário</h2>

<hr>

<form action="{{ url_for('usuarios.salvar_usuario') }}" method="POST">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row">

        <div class="col-md-6 mb-3">

            <label class="form-label">Nome</label>

            <input
                type="text"
                class="form-control"
                name="nome"
                required>

        </div>

        <div class="col-md-6 mb-3">

            <label class="form-label">E-mail</label>

            <input
                type="email"
                class="form-control"
                name="email"
                required>

        </div>

        <div class="col-md-6 mb-3">

            <label class="form-label">Senha</label>

            <input
                type="password"
                class="form-control"
                name="senha"
                required>

        </div>

        <div class="col-md-6 mb-3">

            <label class="form-label">Perfil</label>

            <select
                class="form-select"
                name="perfil"
                required>

                <option value="">Selecione...</option>

                <option value="Administrador">
                    Administrador
                </option>

                <option value="Gerente">
                    Gerente
                </option>

                <option value="Operador">
                    Operador
                </option>

                <option value="Executor">
                    Executor
                </option>

            </select>

        </div>

    </div>

    <button type="submit" class="btn btn-success">

        <i class="bi bi-check-circle"></i>

        Salvar Usuário

    </button>

    <a href="{{ url_for('usuarios.listar_usuarios') }}"
       class="btn btn-secondary">

        Cancelar

    </a>

</form>

{% endblock %}
