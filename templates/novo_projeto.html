{% extends "layout/base.html" %}

{% block title %}
Novo Projeto
{% endblock %}

{% block content %}

<h2>Novo Projeto</h2>

<hr>

<form action="/projetos/salvar" method="POST">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row">

        <div class="mb-3">
            <label>Nome do Projeto</label>
            <input
                type="text"
                class="form-control"
                name="nome"
                required>
        </div>

        <div class="mb-3">
            <label>Cliente</label>

            <select
                class="form-select"
                name="cliente_id"
                required>

                <option value="">Selecione...</option>

                {% for cliente in clientes %}

                <option value="{{ cliente.id }}">
                    {{ cliente.nome }}
                </option>

                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label>Centro de Custo</label>

            <input
                type="text"
                class="form-control"
                name="centro_custo"
                placeholder="Ex.: CC-001">
        </div>

        <div class="mb-3">
            <label>Contato</label>

            <input
                type="text"
                class="form-control"
                name="contato">
        </div>

        <div class="mb-3">
            <label>Telefone</label>

            <input
                type="text"
                class="form-control"
                name="telefone">
        </div>

        <div class="mb-3">
            <label>Responsável</label>

            <input
                type="text"
                class="form-control"
                name="responsavel">
        </div>

        <div class="mb-3">
            <label>Status</label>

            <select
                class="form-select"
                name="status">

                <option>Planejamento</option>
                <option>Em Campo</option>
                <option>Escritório</option>
                <option>Cartório</option>
                <option>Finalizado</option>
                <option>Entregue</option>

            </select>
        </div>

    </div>

    <hr class="my-4">

    <h4 class="mb-3">
        Dados para Emissão da TRT
    </h4>

    <div class="row">

        <div class="col-md-6 mb-3">

            <label>Nome</label>

            <input
                type="text"
                class="form-control"
                name="trt_nome">

        </div>

        <div class="col-md-6 mb-3">

            <label>CPF / CNPJ</label>

            <input
                type="text"
                class="form-control"
                name="trt_cpf_cnpj">

        </div>

        <div class="col-md-6 mb-3">

            <label>Telefone</label>

            <input
                type="text"
                class="form-control"
                name="trt_telefone">

        </div>

        <div class="col-md-6 mb-3">

            <label>Contato</label>

            <input
                type="text"
                class="form-control"
                name="trt_contato">

        </div>

        <div class="col-md-6 mb-3">

            <label>E-mail</label>

            <input
                type="email"
                class="form-control"
                name="trt_email">

        </div>

        <div class="col-md-6 mb-3">

            <label>Endereço</label>

            <input
                type="text"
                class="form-control"
                name="trt_endereco">

        </div>

        <div class="col-md-4 mb-3">

            <label>Cidade</label>

            <input
                type="text"
                class="form-control"
                name="trt_cidade">

        </div>

        <div class="col-md-2 mb-3">

            <label>UF</label>

            <input
                type="text"
                class="form-control"
                maxlength="2"
                name="trt_uf"
                style="text-transform:uppercase">

        </div>

    </div>

    <button class="btn btn-success">
        Salvar Projeto
    </button>

    <a href="/projetos" class="btn btn-secondary">
        Cancelar
    </a>

</form>

{% endblock %}
