{% extends "layout/base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-calendar-event"></i>
            Editar Compromisso
        </h2>

        <a href="{{ url_for('calendario.listar_calendario') }}" 
           class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i>
            Voltar
        </a>
    </div>


    <div class="card shadow">

        <div class="card-body">


            <form method="POST">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


                <!-- TÍTULO -->

                <div class="mb-3">

                    <label class="form-label">
                        Título do compromisso
                    </label>

                    <input 
                        type="text"
                        name="titulo"
                        class="form-control"
                        value="{{ evento.titulo }}"
                        required>

                </div>



                <!-- DESCRIÇÃO -->

                <div class="mb-3">

                    <label class="form-label">
                        Descrição
                    </label>

                    <textarea 
                        name="descricao"
                        class="form-control"
                        rows="4">{{ evento.descricao or '' }}</textarea>

                </div>




                <!-- DATA -->

                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Data início
                        </label>

                        <input 
                            type="date"
                            name="data_inicio"
                            class="form-control"
                            value="{{ evento.data_inicio.strftime('%Y-%m-%d') }}"
                            required>

                    </div>



                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Data fim
                        </label>

                        <input 
                            type="date"
                            name="data_fim"
                            class="form-control"
                            value="{% if evento.data_fim %}{{ evento.data_fim.strftime('%Y-%m-%d') }}{% endif %}">

                    </div>


                </div>





                <!-- HORÁRIOS -->

                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Hora início
                        </label>

                        <input 
                            type="time"
                            name="hora_inicio"
                            class="form-control"
                            value="{{ evento.hora_inicio or '' }}">

                    </div>



                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Hora fim
                        </label>

                        <input 
                            type="time"
                            name="hora_fim"
                            class="form-control"
                            value="{{ evento.hora_fim or '' }}">

                    </div>


                </div>





                <!-- STATUS -->

                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>


                    <select 
                        name="status"
                        class="form-select">


                        <option value="Agendado"
                        {% if evento.status == 'Agendado' %}selected{% endif %}>
                            Agendado
                        </option>


                        <option value="Confirmado"
                        {% if evento.status == 'Confirmado' %}selected{% endif %}>
                            Confirmado
                        </option>


                        <option value="Realizado"
                        {% if evento.status == 'Realizado' %}selected{% endif %}>
                            Realizado
                        </option>


                        <option value="Cancelado"
                        {% if evento.status == 'Cancelado' %}selected{% endif %}>
                            Cancelado
                        </option>


                    </select>


                </div>





                <!-- COR -->

                <div class="mb-3">

                    <label class="form-label">
                        Cor do evento
                    </label>


                    <select 
                        name="cor"
                        class="form-select">


                        <option value="blue"
                        {% if evento.cor == 'blue' %}selected{% endif %}>
                            Azul
                        </option>


                        <option value="green"
                        {% if evento.cor == 'green' %}selected{% endif %}>
                            Verde
                        </option>


                        <option value="orange"
                        {% if evento.cor == 'orange' %}selected{% endif %}>
                            Laranja
                        </option>


                        <option value="red"
                        {% if evento.cor == 'red' %}selected{% endif %}>
                            Vermelho
                        </option>


                    </select>


                </div>







                <!-- PLANEJAMENTO -->

                <div class="mb-3">

                    <label class="form-label">
                        Vincular planejamento (opcional)
                    </label>


                    <select 
                        name="planejamento_id"
                        class="form-select">


                        <option value="">
                            Nenhum
                        </option>


                        {% for planejamento in planejamentos %}

                        <option 
                            value="{{ planejamento.id }}"
                            {% if evento.planejamento_id == planejamento.id %}
                                selected
                            {% endif %}>

                            {{ planejamento.projeto.nome }}

                        </option>


                        {% endfor %}


                    </select>


                </div>






                <div class="d-flex justify-content-end gap-2">


                    <a 
                    <div class="d-flex justify-content-between mt-4">


    <a 
    href="{{ url_for('calendario.excluir_compromisso', id=evento.id) }}"
    class="btn btn-danger"
    onclick="return confirm('Deseja realmente excluir este compromisso?');">

        <i class="bi bi-trash"></i>

        Excluir compromisso

    </a>



    <div class="d-flex gap-2">


        <a 
        href="{{ url_for('calendario.listar_calendario') }}"
        class="btn btn-secondary">

            Cancelar

        </a>



        <button 
        type="submit"
        class="btn btn-success">

            <i class="bi bi-check-circle"></i>

            Salvar alterações

        </button>


    </div>


</div>




            </form>


        </div>

    </div>


</div>


{% endblock %}
