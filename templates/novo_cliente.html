{% extends "layout/base.html" %}

{% block title %}
Novo Cliente
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-success text-white">

        <h4 class="mb-0">

            Novo Cliente

        </h4>

    </div>

    <div class="card-body">

        <form action="/clientes/salvar" method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}">

            <!-- ==========================
                 DADOS DO CONTRATANTE
            =========================== -->

            <h5 class="border-bottom pb-2 mb-4">

                Dados do Contratante

            </h5>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="nome"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        CPF/CNPJ
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="cnpj">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Telefone
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="telefone">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Contato
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="responsavel">

                </div>

                <div class="col-md-12 mb-3">

                    <label class="form-label">
                        E-mail
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        name="email">

                </div>

                <div class="col-md-8 mb-3">

                    <label class="form-label">
                        Endereço
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="endereco">

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Cidade
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="cidade">

                </div>

                <div class="col-md-1 mb-3">

                    <label class="form-label">
                        UF
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="estado"
                        maxlength="2">

                </div>

            </div>

            <div class="d-flex justify-content-end">

                <a
                    href="/clientes"
                    class="btn btn-secondary me-2">

                    Cancelar

                </a>

                <button
                    class="btn btn-success">

                    Salvar Cliente

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
