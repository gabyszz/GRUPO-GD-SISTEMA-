{% extends "layout/base.html" %}

{% block title %}
Editar Usuário
{% endblock %}

{% block content %}

<h2>Editar Usuário</h2>

<hr>

<form action="{{ url_for('usuarios.atualizar_usuario', id=usuario.id) }}"
      method="POST">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row">

        <div class="col-md-6 mb-3">

            <label class="form-label">Nome</label>

            <input
                type="text"
                class="form-control"
                name="nome"
                value="{{ usuario.nome }}"
                required>

        </div>

        <div class="col-md-6 mb-3">

            <label class="form-label">E-mail</label>

            <input
                type="email"
                class="form-control"
                name="email"
                value="{{ usuario.email }}"
                required>

        </div>

        <div class="col-md-6 mb-3">

            <label class="form-label">Perfil</label>

            <select
                class="form-select"
                name="perfil"
                required>

                <option value="Administrador"
                    {% if usuario.perfil == "Administrador" %}selected{% endif %}>
                    Administrador
                </option>

                <option value="Gerente"
                    {% if usuario.perfil == "Gerente" %}selected{% endif %}>
                    Gerente
                </option>

                <option value="Operador"
                    {% if usuario.perfil == "Operador" %}selected{% endif %}>
                    Operador
                </option>

            </select>

        </div>

        <div class="col-md-6 mb-3 d-flex align-items-end">

            <div class="form-check">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="ativo"
                    name="ativo"
                    {% if usuario.ativo %}checked{% endif %}>

                <label class="form-check-label" for="ativo">

                    Usuário Ativo

                </label>

            </div>

        </div>

    </div>

    <button type="submit" class="btn btn-success">

        <i class="bi bi-check-circle"></i>

        Salvar Alterações

    </button>

    <a href="{{ url_for('usuarios.listar_usuarios') }}"
       class="btn btn-secondary">

        Cancelar

    </a>

</form>

<hr class="my-5">

<h4>Alterar Senha</h4>

<form action="{{ url_for('usuarios.alterar_senha', id=usuario.id) }}"
      method="POST">

      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row">

        <div class="col-md-6 mb-3">

            <label class="form-label">Nova Senha</label>

            <input
                type="password"
                class="form-control"
                name="senha"
                required>

        </div>

    </div>

    <button type="submit" class="btn btn-warning">

        <i class="bi bi-key-fill"></i>

        Alterar Senha

    </button>

</form>

{% endblock %}
